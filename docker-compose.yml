x-app-environment: &app-environment
  APP_ENV: "${APP_ENV:-local}"
  APP_DEBUG: "${APP_DEBUG:-true}"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE:-laravel}"
  DB_USERNAME: "${DB_USERNAME:-laravel}"
  DB_PASSWORD: "${DB_PASSWORD:-secret}"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: "${CACHE_STORE:-redis}"
  SESSION_DRIVER: "${SESSION_DRIVER:-redis}"
  QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"

services:
  # --- Shared data stores ---
  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-33060}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-63790}:6379"
    volumes:
      - redis_data:/data

  # --- Nginx + PHP-FPM (traditional) ---
  php-fpm:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    environment: *app-environment

  # --- Apache + mod_php ---
  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    ports:
      - "${APACHE_PORT:-8081}:80"
    volumes:
      - .:/app
    working_dir: /app
    command: ["apache2-foreground"]
    environment: *app-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # --- Laravel Octane variants ---
  octane-frankenphp:
    build:
      context: .
      dockerfile: docker/octane-frankenphp/Dockerfile
    ports:
      - "${OCTANE_FRANKENPHP_PORT:-8000}:8000"
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      OCTANE_SERVER: frankenphp
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - php
      - artisan
      - octane:frankenphp
      - --host=0.0.0.0
      - --port=8000

  octane-swoole:
    build:
      context: .
      dockerfile: docker/octane-swoole/Dockerfile
    ports:
      - "${OCTANE_SWOOLE_PORT:-8001}:8000"
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      OCTANE_SERVER: swoole
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - php
      - artisan
      - octane:start
      - --server=swoole
      - --host=0.0.0.0
      - --port=8000

  octane-roadrunner:
    build:
      context: .
      dockerfile: docker/octane-roadrunner/Dockerfile
    ports:
      - "${OCTANE_ROADRUNNER_PORT:-8002}:8000"
    volumes:
      - .:/app
    environment:
      <<: *app-environment
      OCTANE_SERVER: roadrunner
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command:
      - php
      - artisan
      - octane:start
      - --server=roadrunner
      - --host=0.0.0.0
      - --port=8000

volumes:
  mysql_data:
  redis_data:
